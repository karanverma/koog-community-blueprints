name: Example Builds

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/minimal-agent-build.yml"
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/minimal-agent-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example:
          - 01-minimal-agent
          - 02-safe-tool-agent
          - 03-guarded-tool-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: examples/${{ matrix.example }}/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x examples/${{ matrix.example }}/gradlew

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: ./gradlew clean build --no-daemon
