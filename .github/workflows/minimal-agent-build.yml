name: Minimal Agent Build

on:
  push:
    paths:
      - "examples/01-minimal-agent/**"
      - ".github/workflows/minimal-agent-build.yml"
  pull_request:
    paths:
      - "examples/01-minimal-agent/**"
      - ".github/workflows/minimal-agent-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: examples/01-minimal-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: examples/01-minimal-agent/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build minimal agent
        run: ./gradlew clean build --no-daemon
